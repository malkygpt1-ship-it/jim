<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Good Foundations Login</title>
<link rel="stylesheet" href="styles.css" />
<style>
.login-shell{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#173d2b,#0d2b1d)}
.login-card{width:min(420px,100%);background:white;border-radius:18px;padding:28px;box-shadow:0 20px 60px #06120b55}
.login-card h1{margin:4px 0 6px}.login-card p{margin:0 0 22px;color:#69756f}.login-card label{margin:12px 0}.login-card button{width:100%;margin-top:12px;background:#173d2b;color:white}.login-error{min-height:20px;color:#9a3f3f;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="login-shell">
  <form class="login-card" id="loginForm">
    <div class="eyebrow" style="color:#173d2b">GOOD FOUNDATIONS</div>
    <h1>Estimator Login</h1>
    <p>Sign in to access estimates and materials.</p>
    <label>Username<input id="username" autocomplete="username" autofocus></label>
    <label>Password<input id="password" type="password" autocomplete="current-password"></label>
    <button type="submit">Log in</button>
    <div class="login-error" id="loginError"></div>
  </form>
</div>
<script>
const AUTH_KEY='gf-authenticated';
if(sessionStorage.getItem(AUTH_KEY)==='yes') location.replace('index.html');
document.getElementById('loginForm').addEventListener('submit',e=>{
  e.preventDefault();
  const user=document.getElementById('username').value.trim();
  const pass=document.getElementById('password').value;
  if(user==='jimrutherford' && pass==='celtic1888'){
    sessionStorage.setItem(AUTH_KEY,'yes');
    location.replace('index.html');
  }else{
    document.getElementById('loginError').textContent='Incorrect username or password.';
  }
});
</script>
</body>
</html>
