name: Sync IBT materials

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ibt-categories.json'
      - 'scripts/sync-ibt-materials.mjs'
      - '.github/workflows/sync-ibt-materials.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run IBT catalogue sync
        run: node scripts/sync-ibt-materials.mjs
      - name: Commit generated catalogue
        run: |
          git config user.name "good-foundations-catalogue-bot"
          git config user.email "actions@users.noreply.github.com"
          git add generated/ibt-materials.js generated/ibt-supplier-data.js generated/ibt-costs.js generated/ibt-sync-summary.json
          if git diff --cached --quiet; then
            echo "No catalogue changes"
            exit 0
          fi
          git commit -m "Sync IBT materials catalogue"
          git push
